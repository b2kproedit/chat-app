services:
  db:
    image: postgres:16
    container_name: chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data

volumes:
  chat-db-data:
